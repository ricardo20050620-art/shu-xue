<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考研数学二全面练习大题库</title>
  <meta name="description" content="覆盖考研数学二全部11章，1200+道精选题，逐题配详细解析，支持错题本、收藏、真题模考、学习统计">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://miaoda.feishu.cn">
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;700&display=swap">
</head>
<body>

<!-- 浏览器不支持JS时的提示 -->
<noscript>
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f8f9fc;font-family:sans-serif;">
    <div style="text-align:center;max-width:400px;padding:40px;">
      <h2 style="color:#1a1d29;margin-bottom:16px;">需要启用 JavaScript</h2>
      <p style="color:#5a6178;line-height:1.6;">本题库网站需要 JavaScript 才能正常运行。请在浏览器设置中启用 JavaScript 后刷新页面。</p>
    </div>
  </div>
</noscript>

<!-- 全局错误提示 -->
<div id="global-error" style="display:none;position:fixed;inset:0;z-index:9999;background:#f8f9fc;align-items:center;justify-content:center;font-family:sans-serif;">
  <div style="text-align:center;max-width:500px;padding:40px;">
    <h2 style="color:#e03131;margin-bottom:16px;">页面加载出错</h2>
    <p id="global-error-msg" style="color:#5a6178;line-height:1.6;margin-bottom:20px;"></p>
    <button onclick="location.reload()" style="padding:10px 24px;background:#3b5bdb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;">刷新页面</button>
  </div>
</div>

<script>
// 全局错误捕获
window.addEventListener('error', function(e) {
  var errBox = document.getElementById('global-error');
  var errMsg = document.getElementById('global-error-msg');
  if (errBox && errMsg && e.message && e.message.indexOf('script') === -1) {
    errMsg.textContent = '错误信息: ' + e.message + (e.filename ? '\n文件: ' + e.filename + ':' + e.lineno : '');
    errBox.style.display = 'flex';
  }
});
</script>

<!-- 侧边栏遮罩（移动端） -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="QBApp.toggleSidebar()"></div>

<div class="app-layout">
  <!-- ========== 侧边栏 ========== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">数二</div>
      <div class="sidebar-title">
        考研数学二题库
        <small>全面练习 · 详细解析</small>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="nav-section-label">学习</div>
      <div class="nav-item active" id="nav-home" onclick="QBApp.navigate('/home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        章节目录
      </div>
      <div class="nav-item" id="nav-wrong" onclick="QBApp.navigate('/wrong')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        错题本
        <span class="nav-badge" id="wrong-badge">0</span>
      </div>
      <div class="nav-item" id="nav-favorites" onclick="QBApp.navigate('/favorites')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        收藏夹
        <span class="nav-badge" id="fav-badge">0</span>
      </div>

      <div class="nav-section-label">模考</div>
      <div class="nav-item" id="nav-exam" onclick="QBApp.navigate('/exam')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        真题模考
      </div>

      <div class="nav-section-label">分析</div>
      <div class="nav-item" id="nav-stats" onclick="QBApp.navigate('/stats')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        学习统计
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="btn btn-ghost btn-sm w-full" onclick="QBApp.toggleTheme()" id="theme-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        深色模式
      </button>
    </div>
  </aside>

  <!-- ========== 主内容区 ========== -->
  <main class="main-content">
    <!-- 顶部栏 -->
    <header class="topbar">
      <button class="topbar-menu-btn" onclick="QBApp.toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="搜索题目（关键词、考点、编号如1.3-015）" onkeydown="if(event.key==='Enter')QBApp.doSearch()">
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" onclick="QBApp.toggleTheme()" title="切换主题">
          <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </header>

    <!-- 页面内容 -->
    <div class="page-content" id="app">
      <div class="loading">
        <div class="loading-spinner"></div>
        正在加载题库数据...
      </div>
    </div>
  </main>
</div>

<!-- Toast 容器 -->
<div class="toast-container" id="toast-container"></div>

<!-- ========== 数据文件（按章节加载） ========== -->
<script src="js/data/ch01.js"></script>
<script src="js/data/ch02.js"></script>
<script src="js/data/ch03.js"></script>
<script src="js/data/ch04.js"></script>
<script src="js/data/ch05.js"></script>
<script src="js/data/ch06.js"></script>
<script src="js/data/ch07.js"></script>
<script src="js/data/ch08.js"></script>
<script src="js/data/ch09.js"></script>
<script src="js/data/ch10.js"></script>
<script src="js/data/ch11.js"></script>

<!-- ========== 应用逻辑 ========== -->
<script src="js/app.js"></script>
<script src="js/views.js"></script>

<!-- ========== 初始化 ========== -->
<script>
(function() {
  'use strict';

  // 显示致命错误（带使用说明）
  function showFatalError(msg) {
    var app = document.getElementById('app');
    if (app) {
      app.innerHTML = '<div style="padding:60px 20px;text-align:center;max-width:520px;margin:0 auto;">' +
        '<h2 style="color:#e03131;margin-bottom:16px;font-size:20px;">页面加载失败</h2>' +
        '<p style="color:#5a6178;line-height:1.8;margin-bottom:20px;font-size:14px;">' + msg + '</p>' +
        '<div style="background:#fff4e6;border:1px solid #ffd8a8;border-radius:8px;padding:16px 20px;text-align:left;margin-bottom:20px;">' +
        '<p style="font-size:13px;color:#5a6178;margin-bottom:10px;font-weight:600;">正确使用方法：</p>' +
        '<ol style="font-size:13px;color:#5a6178;padding-left:20px;line-height:2;">' +
        '<li>右键点击下载的 ZIP 文件，选择「全部解压」</li>' +
        '<li>解压到任意文件夹（如桌面）</li>' +
        '<li>打开解压后的文件夹，确认里面有 index.html 和 css、js 文件夹</li>' +
        '<li>双击 index.html 在浏览器中打开</li>' +
        '</ol></div>' +
        '<p style="font-size:12px;color:#8b93a7;margin-bottom:16px;">注意：不要在 ZIP 压缩包预览窗口中直接打开，那样会导致关联文件无法加载。</p>' +
        '<button onclick="location.reload()" style="padding:10px 28px;background:#3b5bdb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;">刷新重试</button>' +
        '</div>';
    }
  }

  // 前置检查：核心模块是否加载
  if (!window.QB) {
    showFatalError('核心脚本加载失败 (app.js)。这通常是因为在压缩包预览中直接打开了文件，或文件未完整解压。');
    return;
  }
  if (!window.QBViews) {
    showFatalError('视图脚本加载失败 (views.js)。请确认已完整解压 ZIP 文件后再打开。');
    return;
  }

  const { State, Router, Utils, Data } = window.QB;

  // 应用控制器
  window.QBApp = {
    navigate(path) {
      Router.navigate(path);
      this.closeSidebar();
    },

    toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
    },

    closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    },

    toggleTheme() {
      const current = State.getTheme();
      const next = current === 'light' ? 'dark' : 'light';
      State.setTheme(next);
      this.updateThemeUI();
    },

    updateThemeUI() {
      const theme = State.getTheme();
      const icon = document.getElementById('theme-icon');
      const btn = document.getElementById('theme-btn');
      if (!icon) return;
      if (theme === 'dark') {
        icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
        if (btn) btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg> 浅色模式';
      } else {
        icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        if (btn) btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg> 深色模式';
      }
    },

    doSearch() {
      const input = document.getElementById('search-input');
      const keyword = input.value.trim();
      if (keyword) {
        window.QBViews.doSearch(keyword);
      }
    },

    updateBadges() {
      const wrongBadge = document.getElementById('wrong-badge');
      const favBadge = document.getElementById('fav-badge');
      if (wrongBadge) wrongBadge.textContent = State.get().wrong.length;
      if (favBadge) favBadge.textContent = State.get().favorites.length;
    }
  };

  // 初始化
  function init() {
    try {
      State.load();
      const theme = State.getTheme();
      document.documentElement.setAttribute('data-theme', theme);
      QBApp.updateThemeUI();
      QBApp.updateBadges();

      const total = Data.getTotalCount();
      if (total === 0) {
        showFatalError('未检测到题目数据（共11个数据文件）。请确认已完整解压 ZIP，且 js/data/ 目录下有 ch01.js ~ ch11.js。');
        return;
      }

      Router.init();
      setInterval(() => QBApp.updateBadges(), 2000);
    } catch (e) {
      showFatalError('初始化失败: ' + e.message);
      console.error('Init error:', e);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
